[project]
name = "aiagent-backend"
version = "0.1.0"
description = "Backend service (FastAPI) for AI agent platform"

[project.dependencies]
fastapi = "^0.98.0"
uvicorn = {extras=["standard"], version="^0.22.0"}
httpx = "^0.24.0"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"