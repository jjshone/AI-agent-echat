name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

template: |
  ## What's Changed
  $CHANGES

  ## Contributors
  $CONTRIBUTORS

categories:
  - title: 🚀 Features
    labels:
      - feature
  - title: 🐛 Fixes
    labels:
      - bug
  - title: 🧰 Infrastructure
    labels:
      - infra
  - title: 🧪 Tests
    labels:
      - test

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

name-template: 'v$NEXT_PATCH'
tag-template: 'v$NEXT_PATCH'

update-template: |
  This draft release was generated from merged PRs on the `main` branch.
